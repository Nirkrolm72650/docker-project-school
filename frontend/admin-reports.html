<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Reporting & Statistiques</title>
    <!-- Tailwind CSS pour un design propre et rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Tableau de Bord - Reporting</h1>

        <!-- Cartes KPIs (Chiffres Clés) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
                <p class="text-gray-500 text-sm uppercase font-semibold">Chiffre d'Affaires</p>
                <p id="total-revenue" class="text-2xl font-bold text-gray-800">Chargement...</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm uppercase font-semibold">Total Commandes</p>
                <p id="total-orders" class="text-2xl font-bold text-gray-800">Chargement...</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-purple-500">
                <p class="text-gray-500 text-sm uppercase font-semibold">Total Clients</p>
                <p id="total-clients" class="text-2xl font-bold text-gray-800">Chargement...</p>
            </div>
        </div>

        <!-- Section Graphique -->
        <div class="bg-white p-6 rounded-lg shadow-md max-w-xl mx-auto">
            <h2 class="text-xl font-semibold text-gray-700 mb-4 text-center">Répartition des Commandes par Statut</h2>
            <canvas id="ordersStatusChart"></canvas>
        </div>
    </div>

    <script>
        // Fonction pour récupérer les données de l'API et mettre à jour le front
        async function loadReports() {
            const token = localStorage.getItem('jwt_token'); // Récupère le token admin stocké lors de la connexion

            if (!token) {
                alert('Veuillez vous connecter en tant qu\'administrateur.');
                window.location.href = 'admin.html'; // Redirige vers la connexion si besoin
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/admin/reports', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Erreur lors de la récupération des rapports');

                const data = await response.json();

                // 1. Injection des chiffres clés
                document.getElementById('total-revenue').innerText = `${data.total_revenue.toFixed(2)} €`;
                document.getElementById('total-orders').innerText = data.total_orders;
                document.getElementById('total-clients').innerText = data.total_clients;

                // 2. Préparation et affichage du graphique Chart.js
                const statuses = data.orders_by_status.map(item => item.status);
                const counts = data.orders_by_status.map(item => parseInt(item.count, 10));

                const ctx = document.getElementById('ordersStatusChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut', // Type de graphique (camembert creux)
                    data: {
                        labels: statuses,
                        datasets: [{
                            label: 'Nombre de commandes',
                            data: counts,
                            backgroundColor: [
                                '#F59E0B', // En attente (pending)
                                '#3B82F6', // Expédié (shipped)
                                '#10B981', // Livré (delivered)
                                '#EF4444'  // Annulé (cancelled)
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                            }
                        }
                    }
                });

            } catch (error) {
                console.error('Erreur:', error);
                alert('Impossible de charger les statistiques.');
            }
        }

        // Charger les données au chargement de la page
        loadReports();
    </script>
</body>
</html>
